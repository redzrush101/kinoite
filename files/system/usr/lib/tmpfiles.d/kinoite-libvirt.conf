# Repair persistent libvirt paths after an image rebase installs the package.
# Unlike /usr, these directories live in /var and can retain the generic labels
# and modes with which they were first created.  In particular, virtlogd is
# denied before QEMU starts if its log directory is left as var_log_t.
Z /var/lib/libvirt - - - -
Z /var/cache/libvirt - - - -
z /var/log/libvirt 0755 root root -
Z /var/log/libvirt/qemu 0700 root root -
