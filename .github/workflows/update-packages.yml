name: update packages

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-lock.py"
      - "files/scripts/install-custom-packages.sh"
      - ".github/workflows/update-packages.yml"
  schedule:
    - cron: "30 04 * * *"
  workflow_dispatch:

concurrency:
  group: package-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Refresh release lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-lock.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git diff --quiet -- files/packages.lock.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/packages.lock.json
          git commit -m "chore: update custom packages"
          git push
